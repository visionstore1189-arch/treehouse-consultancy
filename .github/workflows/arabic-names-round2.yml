name: Temporary Arabic RegTech names RDAP round 2
on:
  push:
    branches: [verify-auth-runtime-health-2026]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Authoritative .com registry query
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          for name in ["example","qzvplorbinx"]+["mutahaqqaq","mutahaqaq","mutahaqeq","mutaqadim","mutaqadem","muqarin","muqaren","mutaqabil","mutaqabel","muwathaq","muwaththaq","mowathaq","muwatheq","muwathiq","mawthoq","mawthouq","mawthouk","mawthook","mawthiq","mawtheq","mutaafiq","muttafiq","muttafeq","munasib","munaseb","muttasil","mutasil","muqayyad","muqayad","muqayed","muqayyid","muqayid","mufassal","mofassal","mufasal","mufassar","mufassir","muashir","muasher","moasher","mouasher","rasekh","rasikh","rasakh","sadiid","sadid","qatie","qatih","manhaji","manhajee","mabadi","mabadiq","qawaeid","qawanin","qanoni","miyaar","meyaar","miqyaas","meqyas","maqayes","maqayees","taqyeem","taqyim","taqeem","taqweem","tawtheeq","tawthiq","muwafaq","mustawfa","muwafi","mowafi","mustaqsa","mustaqsi"]:
              domain=name+".com"
              try:
                  req=urllib.request.Request("https://rdap.verisign.com/com/v1/domain/"+domain,headers={"Accept":"application/rdap+json","User-Agent":"Treehouse-BrandScreen/1.0"})
                  try:
                      with urllib.request.urlopen(req,timeout=12) as r:code=r.status
                  except urllib.error.HTTPError as e:code=e.code
                  print("DOMAINCHECK "+json.dumps({"domain":domain,"http":code,"status":"unregistered" if code==404 else "registered" if code==200 else "unknown"}),flush=True)
              except Exception as e:print("DOMAINCHECK "+json.dumps({"domain":domain,"status":"error","message":str(e)[:75]}),flush=True)
              time.sleep(.2)
          PY

name: Verify MUTABIQ fixed Cloudflare production auth connection
on:
  push:
    branches: [verify-auth-runtime-health-2026]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime endpoint responses
        shell: bash
        run: |
          set -euo pipefail
          HOST="https://treehouse-consultancy.pages.dev"
          for route in "/api/auth/status" "/api/auth/me"; do
            code="$(curl --max-time 20 -sSL -o /tmp/result.json -w '%{http_code}' "$HOST$route")"
            echo "Route $route status $code body:"
            cat /tmp/result.json
            echo
          done
          code="$(curl --max-time 20 -sSL -o /tmp/result.json -w '%{http_code}' \
            -X POST -H "Origin: $HOST" -H "Content-Type: application/json" \
            --data '{"email":"invalid","password":"never-send-real-password"}' \
            "$HOST/api/auth/login")"
          echo "Route /api/auth/login invalid-input status $code body:"
          cat /tmp/result.json
          echo
          key="$(sed -n 's/^const SUPABASE_PUBLIC_KEY = "\(sb_publishable_[^"]*\)";$/\1/p' functions/api/auth/_shared.ts)"
          test -n "$key"
          echo "::add-mask::$key"
          code="$(curl --max-time 20 -sS -o /tmp/result.json -w '%{http_code}' \
            -H "apikey: $key" "https://rylvuhuqjofliceipbka.supabase.co/auth/v1/health")"
          echo "Direct Supabase Auth health status $code body:"
          head -c 1200 /tmp/result.json
          echo
      - name: Assert live Supabase authentication connection is healthy
        shell: bash
        run: |
          set -euo pipefail
          base="https://treehouse-consultancy.pages.dev"
          code="$(curl -sSL --max-time 25 -o /tmp/final-status.json -w '%{http_code}' "$base/api/auth/status")"
          cat /tmp/final-status.json
          echo "Live auth health HTTP status: $code"
          test "$code" = "200"
          grep -Eq '"ready"[[:space:]]*:[[:space:]]*true' /tmp/final-status.json
      - name: Invalid email/password reaches Supabase and is rejected
        shell: bash
        run: |
          set -euo pipefail
          host="https://treehouse-consultancy.pages.dev"
          code="$(curl -sSL --max-time 25 -o /tmp/login-rejected.json -w '%{http_code}' \
            -X POST -H "Origin: $host" -H "Content-Type: application/json" \
            --data '{"email":"unregistered-auth-smoke@invalid.example","password":"obviously-invalid-credential"}' \
            "$host/api/auth/login")"
          echo "Invalid account login status: $code"
          cat /tmp/login-rejected.json
          test "$code" = "401"

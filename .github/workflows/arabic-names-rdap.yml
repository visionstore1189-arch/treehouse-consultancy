name: Temporary Arabic software naming RDAP research
on:
  push:
    branches: [verify-auth-runtime-health-2026]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Authoritative Verisign com RDAP name check
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          names=["muwafiq","muwaafiq","mutawafiq","multazim","mundabit","mundabet","indibat","muthbat","muthbit","ithbat","ithbaat","musaddaq","musadaq","muhkam","ihkam","muhkem","muqayyim","muqayim","mudaqqiq","mudakiq","tadqeeq","tadqiq","muhaqqiq","muntazim","munazzam","muntazam","muqannan","taqnin","muttasiq","mutasiq","munsajim","mutqin","mutqen","mutkan","mustanad","mustanid","musnad","mawthuq","mawthooq","watheeq","watheq","wathiq","mustahiq","muraji","murajee","murajaa","tahqeeq","tahaqquq","tahaqoq","tatabuq","tawafuq","tawafok","wifaq","ittisaq","intizam","istithaq","istithaaq","istiqraa","iqrar","iqraar","idrak","waqaie","mursad","mirsad","muraqib","mustasaf","mustawef","mustaofi","mutabaq","muwaffaq","mowaafiq","muwafaq","mumathil","mumathal","mustaqar","muqarrar","musadaqah"]
          for name in ["example","qzvplorbinx"]+names:
              domain=name+".com"
              try:
                  req=urllib.request.Request("https://rdap.verisign.com/com/v1/domain/"+domain,headers={"Accept":"application/rdap+json, application/json","User-Agent":"Treehouse-BrandResearch/1.0"})
                  try:
                      with urllib.request.urlopen(req,timeout=12) as resp: code=resp.status
                  except urllib.error.HTTPError as err:code=err.code
                  print("RDAPCHECK "+json.dumps({"domain":domain,"status":code,"classification":"unregistered" if code==404 else "registered" if code==200 else "unknown"}),flush=True)
              except Exception as e:print("RDAPCHECK "+json.dumps({"domain":domain,"classification":"error","error":str(e)[:80]}),flush=True)
              time.sleep(0.2)
          PY

name: Temporary domain registry availability research
on:
  push:
    branches: [verify-auth-runtime-health-2026]
permissions:
  contents: read
jobs:
  rdap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query authoritative Verisign COM RDAP for coined names
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          names=["raqnivo","wathivo","dalivra","nizqora","qanvera","athvion","mithqivo","taqvoro","raqtivo","wathriq","qanvexa","veriqar","evidiq","raqivra","nizvera","qaydora","daliqra","wathiqra","athqora","athriqo","qantriva","evidaro","qavrion","nizqivo","veriqra","raqevo","mivthiq","wathera","qantrevo","midaqor"]
          url="https://rdap.verisign.com/com/v1/domain/"
          for name in ["example", "qzvplorbinx"]+names:
              try:
                  req=urllib.request.Request(url+name+".com",headers={"User-Agent":"TreehouseNameScreen/1.0 research","Accept":"application/rdap+json, application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=12) as resp:
                          status=resp.status
                          body=resp.read(4000)
                  except urllib.error.HTTPError as err:
                      status=err.code
                      body=err.read(2000)
                  if status==200:
                      result="REGISTERED"
                  elif status==404:
                      result="NOT_FOUND"
                  else:result="INDETERMINATE"
                  print(json.dumps({"name":name+".com","http":status,"registration":result,"body_start":body[:100].decode("utf-8","ignore") if status not in (200,404) else ""}),flush=True)
              except Exception as e:print(json.dumps({"name":name+".com","registration":"ERROR","error":str(e)[:100]}),flush=True)
              time.sleep(0.35)
          PY
